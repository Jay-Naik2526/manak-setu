# The checks that would have caught this project's real bugs.
#
# None of them are unit tests. Every serious defect here came from two places
# holding one fact and drifting apart — a matcher with two copies, a stale
# flag, a benchmark whose ground truth was written by the thing it measured.
# So the gate is: the invariants hold, the adversarial cases still fail safely,
# and retrieval has not got worse than a level already demonstrated.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (CPU torch — the GPU wheels are 2 GB and nothing here trains)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Build the database from the CSVs
        run: python load_db.py --allow-shrink

      - name: Invariants
        run: python consistency_check.py --quick

      - name: Start the API
        run: |
          nohup uvicorn main:app --port 8000 > /tmp/uvicorn.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health > /dev/null && exit 0
            sleep 2
          done
          echo "the API never became healthy"; cat /tmp/uvicorn.log; exit 1

      - name: Adversarial cases
        run: python qa_adversarial.py

      - name: Server log on failure
        if: failure()
        run: cat /tmp/uvicorn.log || true
